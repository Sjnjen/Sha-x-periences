<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin | Salon Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--rose:#b76e79;--plum:#3b2230;--bg:#f7f1ed;--line:#ecd9d3;--mute:#8a6b72}*{box-sizing:border-box;margin:0}body{font:400 15px/1.5 Jost,sans-serif;background:var(--bg);color:var(--plum)}
h1,h2{font-family:'Cormorant Garamond',serif;font-weight:600}.top{background:var(--plum);color:#fff;padding:.8rem 1rem;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.tabs{display:flex;gap:.3rem;overflow-x:auto;padding:.6rem 1rem;background:#fff;border-bottom:1px solid var(--line)}.tabs button{border:0;background:none;padding:.55rem 1rem;border-radius:99px;cursor:pointer;font:500 .9rem Jost;color:var(--mute);white-space:nowrap}.tabs .a{background:var(--plum);color:#fff}
main{padding:1rem;max-width:1200px;margin:auto}.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.8rem}.k{background:#fff;border:1px solid var(--line);border-radius:14px;padding:1rem}.k b{display:block;font:600 1.8rem 'Cormorant Garamond'}.k span{color:var(--mute);font-size:.8rem}
.p{background:#fff;border:1px solid var(--line);border-radius:14px;padding:1rem;margin-top:1rem;overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{padding:.55rem .5rem;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mute);font-weight:400;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em}
input,select,textarea{padding:.55rem .7rem;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;max-width:100%}button.b{padding:.5rem .9rem;border-radius:99px;border:1px solid var(--rose);background:var(--rose);color:#fff;cursor:pointer;font:500 .82rem Jost}button.b.o{background:#fff;color:var(--rose)}button.b.d{background:#b3261e;border-color:#b3261e}
.bar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}.tag{padding:.15rem .6rem;border-radius:99px;font-size:.75rem;background:#eee}.confirmed{background:#d8f1e3}.pending_payment{background:#fff0c9}.cancelled,.payment_failed{background:#fbd9d6}.completed{background:#dde7ff}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.7rem}.f label{font-size:.78rem;color:var(--mute);display:block}.f input,.f select,.f textarea{width:100%}
#login{max-width:340px;margin:18vh auto;background:#fff;padding:2rem;border-radius:18px;border:1px solid var(--line)}#login input{width:100%;margin:.4rem 0}.err{color:#b3261e}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal div{background:#fff;border:1px solid var(--line);border-radius:8px;min-height:62px;padding:4px;font-size:.75rem;cursor:pointer}.cal .h{min-height:0;background:none;border:0;text-align:center;color:var(--mute);cursor:default}
.ev{background:#f4e3df;border-radius:8px;padding:.4rem .6rem;margin:.3rem 0}.ev.bl{background:#e6e6e6}.fr{display:inline-block;background:#e4f4ea;border-radius:6px;padding:1px 6px;margin:2px;font-size:.78rem}
#dlg{position:fixed;inset:0;background:rgba(59,34,48,.5);display:none;place-items:center;z-index:20;padding:1rem}#dlg.o{display:grid}#dlg>div{background:#fff;border-radius:16px;padding:1.3rem;max-width:520px;width:100%;max-height:90vh;overflow:auto}
</style></head><body>
<div id="login" hidden><h1>Admin sign in</h1><input id="le" type="email" placeholder="Email" autocomplete="username"><input id="lp" type="password" placeholder="Password" autocomplete="current-password"><button class="b" id="lb" style="width:100%;margin-top:.6rem">Sign in</button><p class="err" id="lerr"></p></div>
<div id="app" hidden><div class="top"><h2 style="font-size:1.4rem">Salon Dashboard</h2><div class="bar"><a href="/" style="color:#fff">View site</a><button class="b o" id="lo">Sign out</button></div></div>
<div class="tabs" id="tabs"></div><main id="m"></main></div><div id="dlg"><div id="dc"></div></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=c=>'R'+(c/100).toFixed(2),T=m=>String(m/60|0).padStart(2,'0')+':'+String(m%60).padStart(2,'0'),TM=s=>{const[a,b]=s.split(':');return a*60+ +b};
async function api(u,m='GET',b){const r=await fetch('/api/admin'+u,{method:m,headers:b?{'Content-Type':'application/json'}:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});if(r.status===401){showLogin();throw new Error('Signed out')}const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Error');return j}
const fail=e=>alert(e.message);const tabs={Overview:ov,Appointments:ap,Calendar:cl,Services:sv,Customers:cu,Settings:se,Notifications:nt};
function showLogin(){$('#app').hidden=true;$('#login').hidden=false}
$('#lb').onclick=async()=>{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#le').value,password:$('#lp').value})});if(r.ok)boot();else $('#lerr').textContent=(await r.json()).error};
$('#lo').onclick=async()=>{await fetch('/api/admin/logout',{method:'POST'});showLogin()};
async function boot(){try{await api('/me')}catch{return}$('#login').hidden=true;$('#app').hidden=false;$('#tabs').innerHTML=Object.keys(tabs).map(k=>`<button>${k}</button>`).join('');$('#tabs').onclick=e=>{if(e.target.tagName==='BUTTON')go(e.target.textContent)};go('Overview')}
function go(k){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('a',b.textContent===k));$('#m').innerHTML='Loading…';tabs[k]().catch(e=>$('#m').innerHTML=`<p class="err">${E(e.message)}</p>`)}
const dlg=h=>{$('#dc').innerHTML=h;$('#dlg').classList.add('o')},cdlg=()=>$('#dlg').classList.remove('o');$('#dlg').onclick=e=>{if(e.target.id==='dlg')cdlg()};
const tag=s=>`<span class="tag ${s}">${s.replace('_',' ')}</span>`;
async function ov(){const s=await api('/stats'),k=[['Total bookings',s.total],["Today's appointments",s.today],['Upcoming',s.upcoming],['Pending payments',s.pending],['Confirmed',s.confirmed],['Cancelled',s.cancelled],['Booking fees collected',R(s.fees_collected_cents)],['Outstanding balances',R(s.outstanding_cents)]];$('#m').innerHTML=`<div class="g">${k.map(x=>`<div class="k"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>`}
async function ap(){$('#m').innerHTML=`<div class="bar"><input id="q" placeholder="Search name or reference"><select id="s"><option value="">All statuses</option>${['pending_payment','confirmed','cancelled','completed','payment_failed'].map(x=>`<option>${x}</option>`)}</select><input id="f" type="date"><input id="t" type="date"><button class="b" id="go">Filter</button><button class="b o" id="add">+ Add appointment</button></div><div class="p" id="tb"></div>`;
 const load=async()=>{const p=new URLSearchParams({q:$('#q').value,status:$('#s').value,from:$('#f').value,to:$('#t').value});const a=await api('/appointments?'+p);$('#tb').innerHTML=`<table><tr><th>Ref</th><th>Customer</th><th>Service</th><th>When</th><th>Total</th><th>Fee paid</th><th>Balance</th><th>Status</th><th>Payment</th><th></th></tr>${a.map(x=>`<tr><td>${E(x.reference)}</td><td>${E(x.cname)}<br><small>${E(x.phone)} · ${E(x.email)}</small></td><td>${E(x.service_name)}</td><td>${x.date}<br>${T(x.start_min)}–${T(x.end_min)}</td><td>${R(x.price_cents)}</td><td>${x.pay_status==='paid'?R(x.fee_cents):R(0)}</td><td>${R(x.price_cents-(x.pay_status==='paid'?x.fee_cents:0))}</td><td>${tag(x.status)}</td><td><small>${E(x.pay_status||'—')}<br>${E(x.provider_ref||'')}</small></td><td>${['confirmed','pending_payment'].includes(x.status)?`<button class="b o" data-a="rs" data-i="${x.id}" data-v="${x.service_id}">Move</button> `:''}${x.status==='confirmed'?`<button class="b" data-a="completed" data-i="${x.id}">Done</button> `:''}${['pending_payment','payment_failed','cancelled'].includes(x.status)?`<button class="b o" data-a="confirmed" data-i="${x.id}">Confirm</button> `:''}${['confirmed','pending_payment'].includes(x.status)?`<button class="b d" data-a="cancelled" data-i="${x.id}">Cancel</button>`:''}</td></tr>`).join('')||'<tr><td>No appointments</td></tr>'}</table>`};
 $('#go').onclick=()=>load().catch(fail);$('#add').onclick=manual;$('#tb').onclick=async e=>{const b=e.target.closest('[data-a]');if(!b)return;try{if(b.dataset.a==='rs')return resched(+b.dataset.i,+b.dataset.v);if(b.dataset.a==='confirmed'&&!confirm('Confirm without verified payment?'))return;if(b.dataset.a==='cancelled'&&!confirm('Cancel this appointment?'))return;await api(`/appointments/${b.dataset.i}/status`,'POST',{status:b.dataset.a});load()}catch(x){fail(x)}};load()}
async function slotPick(sid,date,ex,box){box.innerHTML='…';const s=await api(`/slots?service_id=${sid}&date=${date}&exclude=${ex||0}`);box.innerHTML=s.length?s.map(x=>`<label class="fr"><input type="radio" name="sl" value="${x.start}"> ${x.label}</label>`).join(''):'No free slots'}
function resched(id,sid){dlg(`<h2>Reschedule</h2><input type="date" id="rd"><div id="rs" style="margin:.8rem 0"></div><button class="b" id="ok">Save</button> <button class="b o" onclick="cdlg()">Close</button>`);$('#rd').onchange=e=>slotPick(sid,e.target.value,id,$('#rs')).catch(fail);$('#ok').onclick=async()=>{const v=document.querySelector('[name=sl]:checked');if(!v)return alert('Pick a slot');try{await api(`/appointments/${id}/reschedule`,'POST',{date:$('#rd').value,start:+v.value});cdlg();go('Appointments')}catch(e){fail(e)}}}
async function manual(){const S=await api('/services');dlg(`<h2>Add appointment</h2><div class="f"><div><label>Service</label><select id="ms">${S.filter(x=>x.active).map(x=>`<option value="${x.id}">${E(x.name)}</option>`)}</select></div><div><label>Name</label><input id="mn"></div><div><label>Phone</label><input id="mp"></div><div><label>Email (optional)</label><input id="me"></div><div><label>Date</label><input type="date" id="md"></div></div><div id="msl" style="margin:.8rem 0"></div><button class="b" id="ok">Create</button> <button class="b o" onclick="cdlg()">Close</button>`);
 const up=()=>$('#md').value&&slotPick($('#ms').value,$('#md').value,0,$('#msl')).catch(fail);$('#md').onchange=up;$('#ms').onchange=up;$('#ok').onclick=async()=>{const v=document.querySelector('[name=sl]:checked');if(!v)return alert('Pick a slot');try{await api('/appointments','POST',{service_id:+$('#ms').value,name:$('#mn').value,phone:$('#mp').value,email:$('#me').value,date:$('#md').value,start:+v.value});cdlg();go('Appointments')}catch(e){fail(e)}}}
let cv='week',cd=new Date().toISOString().slice(0,10);
async function cl(){const d=new Date(cd+'T00:00:00Z'),iso=x=>x.toISOString().slice(0,10),add=(x,n)=>new Date(x.getTime()+n*864e5);let a,b;
 if(cv==='day')a=b=d;else if(cv==='week'){a=add(d,-((d.getUTCDay()+6)%7));b=add(a,6)}else{a=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1));b=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0))}
 const [ap,bl,cfg]=await Promise.all([api(`/appointments?from=${iso(a)}&to=${iso(b)}`),api('/blocks'),api('/settings')]);const act=ap.filter(x=>['confirmed','pending_payment','completed'].includes(x.status));
 const head=`<div class="bar">${['day','week','month'].map(v=>`<button class="b ${v===cv?'':'o'}" data-v="${v}">${v}</button>`).join('')}<button class="b o" data-n="-1">‹</button><b>${iso(a)}${a-b?' → '+iso(b):''}</b><button class="b o" data-n="1">›</button></div>`;let body='';
 if(cv==='month'){const lead=(a.getUTCDay()+6)%7;body=`<div class="cal">${'MTWTFSS'.split('').map(x=>`<div class="h">${x}</div>`).join('')}${Array(lead).fill('<div class="h"></div>').join('')}${Array.from({length:b.getUTCDate()},(_,i)=>{const k=iso(add(a,i)),n=act.filter(x=>x.date===k).length,blk=bl.some(x=>x.date===k&&x.start_min==null),cl=!cfg.hours[add(a,i).getUTCDay()];return`<div data-d="${k}"><b>${i+1}</b><br>${cl?'<small>Closed</small>':blk?'<small>Blocked</small>':n?`<span class="tag confirmed">${n} booked</span>`:''}</div>`}).join('')}</div>`}
 else{for(let x=a;x<=b;x=add(x,1)){const k=iso(x),h=cfg.hours[x.getUTCDay()],ev=act.filter(e=>e.date===k).sort((p,q)=>p.start_min-q.start_min);body+=`<div class="p"><b>${k}</b> ${h?`<small>(${T(h[0])}–${T(h[1])})</small>`:'<small>Closed</small>'}${ev.map(e=>`<div class="ev">${T(e.start_min)}–${T(e.end_min)} · ${E(e.service_name)} · ${E(e.cname)} ${tag(e.status)}</div>`).join('')}${bl.filter(y=>y.date===k).map(y=>`<div class="ev bl">Blocked ${y.start_min==null?'all day':T(y.start_min)+'–'+T(y.end_min)} ${E(y.reason)}</div>`).join('')}<div class="fs" data-k="${k}"></div></div>`}}
 $('#m').innerHTML=head+body;$('#m').onclick=e=>{const t=e.target.closest('[data-v],[data-n],[data-d]');if(!t)return;if(t.dataset.v)cv=t.dataset.v;if(t.dataset.n){const n=+t.dataset.n;cd=iso(cv==='month'?new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+n,1)):add(d,n*(cv==='week'?7:1)))}if(t.dataset.d){cd=t.dataset.d;cv='day'}cl().catch(fail)};
 const S=await api('/services'),sm=S.filter(x=>x.active).sort((p,q)=>p.duration_min-q.duration_min)[0];if(sm)for(const f of document.querySelectorAll('.fs')){const s=await api(`/slots?service_id=${sm.id}&date=${f.dataset.k}`);f.innerHTML=s.length?'<small>Free starts:</small> '+s.map(x=>`<span class="fr">${x.label}</span>`).join(''):''}}
async function sv(){const S=await api('/services');$('#m').innerHTML=`<button class="b" id="new">+ Add service</button><div class="p"><table><tr><th></th><th>Name</th><th>Price</th><th>Duration</th><th>Active</th><th></th></tr>${S.map(x=>`<tr><td>${x.image?`<img src="${E(x.image)}" width="44" height="44" style="object-fit:cover;border-radius:8px">`:''}</td><td>${E(x.name)}<br><small>${E(x.category)}</small></td><td>${R(x.price_cents)}</td><td>${x.duration_min}m</td><td>${x.active?'Yes':'Disabled'}</td><td><button class="b o" data-e="${x.id}">Edit</button> <button class="b d" data-x="${x.id}">Delete</button></td></tr>`).join('')}</table></div>`;
 const form=x=>{x=x||{name:'',description:'',price_cents:0,duration_min:60,requirements:'',category:'Styling',active:1,sort:0};dlg(`<h2>${x.id?'Edit':'New'} service</h2><div class="f"><div><label>Name</label><input id="n" value="${E(x.name)}"></div><div><label>Category</label><input id="c" value="${E(x.category)}"></div><div><label>Price (R)</label><input id="p" type="number" step="0.01" value="${x.price_cents/100}"></div><div><label>Duration (min)</label><input id="d" type="number" value="${x.duration_min}"></div><div><label>Sort order</label><input id="so" type="number" value="${x.sort}"></div><div><label>Image (JPG/PNG/WebP ≤4MB)</label><input id="im" type="file" accept="image/*"></div></div><label>Description</label><textarea id="de" rows="2" style="width:100%">${E(x.description)}</textarea><label>Special requirements</label><input id="rq" style="width:100%" value="${E(x.requirements)}"><label><input type="checkbox" id="ac" ${x.active?'checked':''}> Active (bookable)</label><br><button class="b" id="ok">Save</button> <button class="b o" onclick="cdlg()">Close</button>`);
  $('#ok').onclick=async()=>{const body={name:$('#n').value,category:$('#c').value,price:$('#p').value,duration_min:$('#d').value,sort:$('#so').value,description:$('#de').value,requirements:$('#rq').value,active:$('#ac').checked};const f=$('#im').files[0];if(f){body.image_data=await new Promise(r=>{const fr=new FileReader;fr.onload=()=>r(fr.result);fr.readAsDataURL(f)})}try{await api(x.id?'/services/'+x.id:'/services',x.id?'PUT':'POST',body);cdlg();sv()}catch(e){fail(e)}}};
 $('#new').onclick=()=>form();$('#m').onclick=async e=>{const b=e.target.closest('[data-e],[data-x]');if(!b)return;try{if(b.dataset.e)form(S.find(x=>x.id==b.dataset.e));else if(confirm('Delete this service?')){const r=await api('/services/'+b.dataset.x,'DELETE');if(r.note)alert(r.note);sv()}}catch(x){fail(x)}}}
async function cu(){const C=await api('/customers');$('#m').innerHTML=`<div class="p"><table><tr><th>Name</th><th>Phone</th><th>Email</th><th>Bookings</th><th>Last visit</th><th></th></tr>${C.map(c=>`<tr><td>${E(c.name)}</td><td>${E(c.phone)}</td><td>${E(c.email)}</td><td>${c.bookings}</td><td>${c.last_visit||'—'}</td><td><button class="b o" data-h="${c.id}">History</button></td></tr>`).join('')}</table></div>`;
 $('#m').onclick=async e=>{const b=e.target.closest('[data-h]');if(!b)return;const h=await api(`/customers/${b.dataset.h}/history`);dlg(`<h2>History</h2><table>${h.map(x=>`<tr><td>${x.date}</td><td>${E(x.service_name)}</td><td>${tag(x.status)}</td><td>${R(x.price_cents)}</td></tr>`).join('')}</table><button class="b o" onclick="cdlg()">Close</button>`)}}
async function nt(){const N=await api('/notifications');$('#m').innerHTML=`<div class="p"><table><tr><th>Time</th><th>Booking</th><th>Type</th><th>Channel</th><th>To</th><th>Status</th><th>Detail</th></tr>${N.map(n=>`<tr><td>${E(n.created_at)}</td><td>${E(n.reference||'')}</td><td>${E(n.type)}</td><td>${n.channel}</td><td>${E(n.recipient)}</td><td>${E(n.status)}</td><td>${E(n.error||'')}</td></tr>`).join('')}</table></div>`}
async function se(){const S=await api('/settings'),B=await api('/blocks'),dn=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
 $('#m').innerHTML=`<div class="p"><h2>Business</h2><div class="f"><div><label>Salon name</label><input id="sn" value="${E(S.salon_name)}"></div><div><label>WhatsApp (intl, no +)</label><input id="sw" value="${E(S.whatsapp)}"></div><div><label>Notification email</label><input id="sc" value="${E(S.contact_email)}"></div><div><label>Phone</label><input id="sp" value="${E(S.phone)}"></div><div><label>Address</label><input id="sa" value="${E(S.address)}"></div><div><label>Instagram URL</label><input id="ig" value="${E(S.instagram)}"></div><div><label>TikTok URL</label><input id="tk" value="${E(S.tiktok)}"></div><div><label>Facebook URL</label><input id="fb" value="${E(S.facebook)}"></div><div><label>Shachah photo (hero)</label><input id="hi" type="file" accept="image/*"></div></div></div>
 <div class="p"><h2>Booking fee &amp; cancellation</h2><div class="f"><div><label>Fee type</label><select id="ft"><option value="fixed" ${S.fee_type==='fixed'?'selected':''}>Fixed amount (R)</option><option value="percent" ${S.fee_type==='percent'?'selected':''}>Percentage of price (%)</option></select></div><div><label>Value (R or %)</label><input id="fv" type="number" step="0.01" value="${S.fee_type==='fixed'?S.fee_value/100:S.fee_value}"></div><div><label>Online cancellation cut-off (hours before)</label><input id="ch" type="number" value="${S.cancel_hours}"></div><div><label>Slot interval (min)</label><input id="ss" type="number" value="${S.slot_step}"></div></div></div>
 <div class="p"><h2>Operating hours</h2>${[1,2,3,4,5,6,0].map(i=>{const h=S.hours[i];return`<div class="bar" style="margin:.3rem 0"><span style="width:100px">${dn[i]}</span><label><input type="checkbox" id="o${i}" ${h?'checked':''}> Open</label><input type="time" id="a${i}" value="${h?T(h[0]):'08:00'}"><input type="time" id="z${i}" value="${h?T(h[1]):'17:00'}"></div>`}).join('')}</div>
 <div class="p"><h2>Notifications</h2>${Object.entries(S.notify).map(([k,v])=>`<label style="display:block"><input type="checkbox" data-n="${k}" ${v?'checked':''}> ${k.replace(/_/g,' ')}</label>`).join('')}</div>
 <div class="p"><h2>Testimonials</h2><small>One per line: Name | Quote</small><textarea id="ts" rows="4" style="width:100%">${E(S.testimonials.map(t=>t.name+' | '+t.text).join('\n'))}</textarea></div>
 <p><button class="b" id="sv">Save settings</button></p>
 <div class="p"><h2>Blocked dates &amp; times</h2><div class="bar"><input type="date" id="bd"><input type="time" id="bs"><input type="time" id="be"><input id="br" placeholder="Reason"><button class="b" id="ba">Block</button></div><small>Leave times empty to block the whole day.</small><table>${B.map(x=>`<tr><td>${x.date}</td><td>${x.start_min==null?'All day':T(x.start_min)+'–'+T(x.end_min)}</td><td>${E(x.reason)}</td><td><button class="b d" data-b="${x.id}">Remove</button></td></tr>`).join('')}</table></div>`;
 $('#sv').onclick=async()=>{const hours={};for(let i=0;i<7;i++)hours[i]=$('#o'+i).checked?[TM($('#a'+i).value),TM($('#z'+i).value)]:null;const nf={};document.querySelectorAll('[data-n]').forEach(c=>nf[c.dataset.n]=c.checked);const fv=+$('#fv').value;
  const body={salon_name:$('#sn').value,whatsapp:$('#sw').value.replace(/\D/g,''),contact_email:$('#sc').value,phone:$('#sp').value,address:$('#sa').value,instagram:$('#ig').value,tiktok:$('#tk').value,facebook:$('#fb').value,fee_type:$('#ft').value,fee_value:$('#ft').value==='fixed'?Math.round(fv*100):Math.round(fv),cancel_hours:+$('#ch').value,slot_step:+$('#ss').value,hours,notify:nf,testimonials:$('#ts').value.split('\n').filter(l=>l.includes('|')).map(l=>{const[n,...t]=l.split('|');return{name:n.trim(),text:t.join('|').trim()}})};
  const f=$('#hi').files[0];if(f)body.hero_image=await new Promise(r=>{const fr=new FileReader;fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});try{await api('/settings','PUT',body);alert('Saved');se()}catch(e){fail(e)}};
 $('#ba').onclick=async()=>{const s=$('#bs').value,e=$('#be').value;try{await api('/blocks','POST',{date:$('#bd').value,start:s&&e?TM(s):null,end:s&&e?TM(e):null,reason:$('#br').value});se()}catch(x){fail(x)}};
 $('#m').onclick=async e=>{const b=e.target.closest('[data-b]');if(b){await api('/blocks/'+b.dataset.b,'DELETE');se()}}}
boot();
</script></body></html>
